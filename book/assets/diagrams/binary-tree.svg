<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">Binary tree</title>
  <desc id="desc">A binary tree with one root and two levels of children.</desc>
  <rect width="680" height="300" fill="#ffffff"/>
  <g stroke="#2b5c84" stroke-width="3">
    <line x1="340" y1="70" x2="220" y2="145"/>
    <line x1="340" y1="70" x2="460" y2="145"/>
    <line x1="220" y1="145" x2="150" y2="225"/>
    <line x1="220" y1="145" x2="290" y2="225"/>
    <line x1="460" y1="145" x2="390" y2="225"/>
    <line x1="460" y1="145" x2="530" y2="225"/>
  </g>
  <g font-family="Avenir, Arial, sans-serif" font-size="20" fill="#1f2d3a" text-anchor="middle">
    <g><circle cx="340" cy="70" r="28" fill="#eaf2fb" stroke="#9fb3c8" stroke-width="2"/><text x="340" y="77">root</text></g>
    <g><circle cx="220" cy="145" r="26" fill="#f7f9fb" stroke="#9fb3c8" stroke-width="2"/><text x="220" y="152">L</text></g>
    <g><circle cx="460" cy="145" r="26" fill="#f7f9fb" stroke="#9fb3c8" stroke-width="2"/><text x="460" y="152">R</text></g>
    <g><circle cx="150" cy="225" r="24" fill="#f7f9fb" stroke="#9fb3c8" stroke-width="2"/><text x="150" y="232">A</text></g>
    <g><circle cx="290" cy="225" r="24" fill="#f7f9fb" stroke="#9fb3c8" stroke-width="2"/><text x="290" y="232">B</text></g>
    <g><circle cx="390" cy="225" r="24" fill="#f7f9fb" stroke="#9fb3c8" stroke-width="2"/><text x="390" y="232">C</text></g>
    <g><circle cx="530" cy="225" r="24" fill="#f7f9fb" stroke="#9fb3c8" stroke-width="2"/><text x="530" y="232">D</text></g>
  </g>
</svg>
